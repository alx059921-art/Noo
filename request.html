<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نسج | طلب تصميم موقع</title>

    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>

</head>



<body>


    <main>


        <section id="request-section">


            <div class="back-bar">

                <a href="اعلان.html" class="back-home-link">
                    ← العودة للدعاية والإعلان
                </a>

            </div>



            <h2>
                طلب تصميم موقع
            </h2>


            <p>
                أخبرينا عن فكرتك وسنعمل على تحويلها إلى موقع
                إلكتروني مميز يناسب احتياجاتك.
            </p>



            <form class="request-form">


                <!-- اسم العميل -->

                <div class="form-group">

                    <label for="name">
                        الاسم الكامل
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="اكتبي اسمك الكامل"
                        required>

                </div>



                <!-- الحساب -->

                <div class="form-group">

                    <label for="account">
                        حساب التواصل
                    </label>

                    <input
                        type="text"
                        id="account"
                        name="account"
                        placeholder="مثال: @username"
                        required>

                </div>



                <!-- نوع الخدمة -->

                <div class="form-group">

                    <label for="service">
                        نوع الخدمة المطلوبة
                    </label>

                    <select
                        id="service"
                        name="service"
                        required>

                        <option value="">
                            اختاري نوع الخدمة
                        </option>

                        <option value="new">
                            تصميم موقع جديد
                        </option>

                        <option value="redesign">
                            إعادة تصميم موقع
                        </option>

                        <option value="landing">
                            تصميم صفحة هبوط
                        </option>

                        <option value="ecommerce">
                            تصميم متجر إلكتروني
                        </option>

                    </select>

                </div>



                <!-- وصف الصفحة -->

                <div class="form-group">

                    <label for="description">
                        وصف عن الموقع
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="5"
                        placeholder="اكتبي فكرة مختصرة عن الموقع وما الذي تريدين أن يقدمه..."
                        required>
                    </textarea>

                </div>



                <!-- الألوان -->

                <div class="form-group">

                    <label for="colors">
                        ثيم الألوان المفضل
                    </label>

                    <select
                        id="colors"
                        name="colors"
                        required>

                        <option value="">
                            اختاري الألوان
                        </option>

                        <option value="pink">
                            وردي وناعم
                        </option>

                        <option value="purple">
                            بنفسجي
                        </option>

                        <option value="blue">
                            أزرق
                        </option>

                        <option value="green">
                            أخضر
                        </option>

                        <option value="dark">
                            داكن
                        </option>

                        <option value="neutral">
                            ألوان محايدة
                        </option>

                        <option value="custom">
                            ألوان أخرى
                        </option>

                    </select>

                </div>



                <!-- الفئة العمرية -->

                <div class="form-group">

                    <label for="age">
                        الفئة العمرية المستهدفة
                    </label>

                    <select
                        id="age"
                        name="age"
                        required>

                        <option value="">
                            اختاري الفئة العمرية
                        </option>

                        <option value="children">
                            الأطفال
                        </option>

                        <option value="teens">
                            المراهقون
                        </option>

                        <option value="young">
                            الشباب
                        </option>

                        <option value="adults">
                            البالغون
                        </option>

                        <option value="all">
                            جميع الأعمار
                        </option>

                    </select>

                </div>



                <!-- نوع الموقع -->

                <div class="form-group">

                    <label for="website-type">
                        نوع الموقع
                    </label>

                    <select
                        id="website-type"
                        name="website-type"
                        required>

                        <option value="">
                            اختاري نوع الموقع
                        </option>

                        <option value="games">
                            ألعاب
                        </option>

                        <option value="store">
                            متجر إلكتروني
                        </option>

                        <option value="blog">
                            مدونة
                        </option>

                        <option value="portfolio">
                            معرض أعمال
                        </option>

                        <option value="company">
                            موقع شركة
                        </option>

                        <option value="education">
                            تعليمي
                        </option>

                        <option value="personal">
                            شخصي
                        </option>

                        <option value="news">
                            أخبار ومقالات
                        </option>

                        <option value="other">
                            نوع آخر
                        </option>

                    </select>

                </div>



                <!-- زر إرسال الطلب -->

                <button
                    type="submit"
                    class="ve form-submit">

                    إرسال طلب التصميم

                </button>


            </form>



            <br>


            <a href="start.html" class="ve">
                العودة إلى الصفحة الرئيسية ←
            </a>


        </section>


    </main>


</body>

</html>
